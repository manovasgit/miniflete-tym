<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b0000">
<meta name="description" content="Repartos y fletes – Miniflete TyM">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reparto TyM">
<title>Reparto TyM</title>
<!-- Tarjeta al compartir el link (WhatsApp, Facebook, Telegram) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Miniflete TyM">
<meta property="og:title" content="TyM">
<meta property="og:description" content="Repartos y fletes · Miniflete TyM">
<meta property="og:url" content="https://manovasgit.github.io/miniflete-tym/reparto/">
<meta property="og:image" content="https://manovasgit.github.io/miniflete-tym/reparto/icons/tarjeta.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_AR">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="barra">
  <div class="barra-titulo">
    <strong>Reparto TyM</strong>
    <span id="chip-estado" class="chip" hidden></span>
  </div>
  <span id="chip-sync" class="chip-sync" hidden></span>
  <button id="btn-ajustes" class="btn-icono" aria-label="Ajustes">⚙</button>
</header>
<nav id="tabs-chofer" class="p-tabs" hidden></nav>

<main id="vista" class="vista"></main>

<!-- El mapa del recorrido vive fuera de #vista para no recrearlo en cada render -->
<section id="panel-mapa" class="panel-mapa" hidden>
  <div id="mapa-recorrido" class="mapa"></div>
</section>

<!-- Hoja inferior genérica: formularios, motivos, elecciones -->
<div id="hoja-fondo" class="hoja-fondo" hidden></div>
<section id="hoja" class="hoja" role="dialog" aria-modal="true" hidden></section>

<!-- Ubicador: confirmar la dirección en el mapa (pantalla completa) -->
<section id="ubicador" class="ubicador" role="dialog" aria-modal="true" hidden>
  <header class="barra">
    <button id="ubi-volver" class="btn-icono" aria-label="Volver">←</button>
    <div class="barra-titulo"><strong>Confirmá la ubicación</strong></div>
    <span></span>
  </header>
  <div id="ubi-mapa" class="mapa ubi-mapa"></div>
  <div class="ubi-pie">
    <p id="ubi-ayuda" class="ayuda">Tocá o arrastrá el pin para corregir.</p>
    <div id="ubi-lista" class="ubi-lista"></div>
    <button id="ubi-mas" class="btn btn-sec btn-chico">Buscar más opciones</button>
    <button id="ubi-ok" class="btn btn-pri">Confirmar ubicación</button>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<footer class="pie">Reparto TyM · v<span id="version"></span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/routing.js"></script>
<script src="js/mapa.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/sesion.js"></script>
<script src="js/push.js"></script>
<script src="js/form-parada.js"></script>
<script src="js/fletes.js"></script>
<script src="js/reparto.js"></script>
<script src="js/instalar.js"></script>
<script>
  // Service worker con scope limitado a /reparto/. Solo se desregistran SW de scope
  // ancestro (la raíz vieja), nunca los de apps hermanas (unidades, cotizador).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      var miScope = new URL('./', location.href).href;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          if (miScope.indexOf(reg.scope) === 0 && reg.scope !== miScope) reg.unregister();
        });
      }).catch(function () {});
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    });
  }
</script>
</body>
</html>
