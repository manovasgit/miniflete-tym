name: Subir apps a Ferozo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ferozo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          HOST="${FTP_SERVER#ftp://}"; HOST="${HOST#ftps://}"; HOST="${HOST%%/*}"; HOST="$(echo -n "$HOST" | tr -d '[:space:]')"
          cat > deploy.lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate false
          set net:max-retries 2
          set net:timeout 30
          debug 3
          open -u "$FTP_USER","$FTP_PASSWORD" "$HOST"
          ls
          mirror --reverse --only-newer --parallel=2 --verbose --exclude-glob .git* --exclude .git/ --exclude .github/ --exclude-glob *.md --exclude reparto/apps-script/ --exclude-glob deploy.lftp ./ ./
          bye
          EOF
          lftp -f deploy.lftp
